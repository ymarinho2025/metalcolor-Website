<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento Pix | Usee Kyle</title><link rel="stylesheet" href="/assets/css/catalog.css"><script src="/assets/js/payment-config.js" defer></script><style>body{display:grid;place-items:center;min-height:100vh;padding:28px}.pay{width:min(620px,100%);background:#111;border:1px solid #2b2b2b;border-radius:18px;padding:28px}.row{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid #252525}.pix{margin:20px 0;padding:18px;background:#090909;border:1px solid #292929;border-radius:12px}.key{font-weight:900;word-break:break-all;font-size:1.15rem}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:900;cursor:pointer;margin-top:10px}.btn.alt{background:#222;color:#fff;border:1px solid #444}.status{color:#aaa;font-size:.9rem}</style></head><body><main class="pay"><h1>Pagamento via Pix</h1><p class="status">Confira seu pedido e faça o pagamento diretamente para a loja.</p><div class="row"><span>Pedido</span><strong id="oid">—</strong></div><div class="row"><span>Produto</span><strong id="prod">—</strong></div><div class="row"><span>Opção</span><strong id="opt">—</strong></div><div class="row"><span>Valor</span><strong id="val">—</strong></div><section class="pix"><p><b>Tipo:</b> <span id="type">—</span></p><p><b>Recebedor:</b> <span id="receiver">—</span></p><p class="key" id="key">—</p><button class="btn" id="copy">COPIAR CHAVE PIX</button></section><section class="pix" id="codebox" hidden><textarea id="code" style="width:100%;min-height:100px;background:#050505;color:#fff;border:1px solid #333;border-radius:8px;padding:10px" readonly></textarea><button class="btn alt" id="copycode">COPIAR PIX COPIA E COLA</button></section><p id="status" class="status">Após pagar, clique abaixo e envie o comprovante pelo WhatsApp.</p><button class="btn" id="zap">JÁ PAGUEI — ENVIAR COMPROVANTE</button><a class="back-link" href="/produtos/todos-os-itens/">← Voltar ao catálogo</a></main><script>window.addEventListener('DOMContentLoaded',()=>{const c=window.PAYMENT_CONFIG||{};const q=new URLSearchParams(location.search);let s=null;try{s=JSON.parse(sessionStorage.getItem('useekyle_order')||'null')}catch{}const id=q.get('product')||s?.productId;const p=c.products?.[id];const name=q.get('name')||s?.name;const option=q.get('option')||s?.option||'ÚNICO';const order=q.get('order')||s?.id||('UK-'+Date.now().toString(36).toUpperCase());if(!p||!name){document.querySelector('.pay').innerHTML='<h1>Pedido inválido</h1><a class="back-link" href="/produtos/todos-os-itens/">Voltar ao catálogo</a>';return}const money=(p.priceCents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});oid.textContent=order;prod.textContent=p.name;opt.textContent=option;val.textContent=money;type.textContent=c.pixKeyType||'Pix';receiver.textContent=c.pixReceiverName||c.storeName;key.textContent=c.pixKey||'CHAVE PIX NÃO CONFIGURADA';const status=document.getElementById('status');async function cp(t,msg){try{await navigator.clipboard.writeText(t);status.textContent=msg}catch{status.textContent='Copie manualmente o conteúdo exibido.'}}copy.onclick=()=>cp(c.pixKey||'','Chave Pix copiada.');if((c.pixCopyPaste||'').trim()){codebox.hidden=false;code.value=c.pixCopyPaste;copycode.onclick=()=>cp(c.pixCopyPaste,'Pix Copia e Cola copiado.')}zap.onclick=()=>{const n=String(c.whatsappNumber||'').replace(/\D/g,'');const t=`Olá! Eu, ${name}, realizei o pagamento do pedido ${order}.\n\nProduto: ${p.name}\nOpção/Tamanho: ${option}\nValor: ${money}\n\nEstou encaminhando o comprovante para confirmação e finalização do pedido.`;location.href=`https://wa.me/${n}?text=${encodeURIComponent(t)}`}});</script></body></html>
