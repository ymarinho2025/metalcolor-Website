<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pagamento Pix | Usee Kyle</title>
  <link rel="stylesheet" href="/assets/css/store.css">
  <script src="/assets/js/payment-config.js" defer></script>
  <style>
    .pay-card{width:min(580px,100%)}
    .order-box,.pixbox{margin:18px 0;padding:18px;border:1px solid #2c2c2c;border-radius:12px;text-align:left;background:#0d0d0d}
    .order-row{display:flex;justify-content:space-between;gap:18px;padding:7px 0;border-bottom:1px solid #222}.order-row:last-child{border-bottom:0}
    .pix-value{font-size:1.18rem;font-weight:800;word-break:break-all;color:#fff}
    .pixcode{width:100%;box-sizing:border-box;padding:12px;border:1px solid #333;border-radius:8px;background:#080808;color:#eee;resize:none}
    .actions{display:grid;gap:10px;margin-top:12px}.buy-button.secondary{background:#202020;color:#fff;border:1px solid #3a3a3a;margin-top:0}
    .notice{font-size:.88rem;color:#aaa!important}.ok{color:#9ee6aa!important}.warning{color:#ffd486!important}
  </style>
</head>
<body class="status-page">
<main class="status-card pay-card">
  <div class="brand">USEE KYLE</div>
  <h1>Pagamento via Pix</h1>
  <p id="intro">Confira o pedido e faça o Pix diretamente para a loja.</p>

  <section class="order-box" id="order-box">
    <div class="order-row"><span>Pedido</span><strong id="order-id">—</strong></div>
    <div class="order-row"><span>Produto</span><strong id="product">—</strong></div>
    <div class="order-row"><span>Tamanho</span><strong id="size">—</strong></div>
    <div class="order-row"><span>Valor</span><strong id="amount">—</strong></div>
  </section>

  <section class="pixbox">
    <p class="notice">Pague usando a chave abaixo:</p>
    <p><strong>Tipo:</strong> <span id="pix-type">—</span></p>
    <p><strong>Recebedor:</strong> <span id="receiver">—</span></p>
    <p class="pix-value" id="pix-key">—</p>
    <div class="actions">
      <button class="buy-button" id="copy-key" type="button">COPIAR CHAVE PIX</button>
    </div>
  </section>

  <section class="pixbox" id="copy-paste-box" hidden>
    <p><strong>Pix Copia e Cola</strong></p>
    <textarea id="pix-code" class="pixcode" rows="5" readonly></textarea>
    <div class="actions"><button class="buy-button secondary" id="copy-code" type="button">COPIAR PIX COPIA E COLA</button></div>
  </section>

  <p id="status" class="notice">Após pagar, clique no botão abaixo e envie o comprovante pelo WhatsApp.</p>
  <button class="buy-button" id="whatsapp" type="button">JÁ PAGUEI — ENVIAR COMPROVANTE</button>
  <a class="secondary-link" href="/produtos/produto1/">Voltar ao produto</a>
</main>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const cfg = window.PAYMENT_CONFIG || {};
  const params = new URLSearchParams(location.search);
  let stored = null;
  try { stored = JSON.parse(sessionStorage.getItem('useekyle_order') || 'null'); } catch (_) {}

  const productId = params.get('product') || stored?.productId || 'oversized-01';
  const product = cfg.products?.[productId];
  const size = params.get('size') || stored?.size || '';
  const name = params.get('name') || stored?.name || '';
  const orderId = params.get('order') || stored?.id || ('UK-' + Date.now().toString(36).toUpperCase());

  if (!product || !product.allowedSizes?.includes(size) || !name) {
    document.querySelector('main').innerHTML = '<div class="brand">USEE KYLE</div><h1>Pedido inválido</h1><p>Volte ao produto e preencha os dados novamente.</p><a class="secondary-link" href="/produtos/produto1/">Voltar ao produto</a>';
    return;
  }

  const amount = (product.priceCents / 100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  document.getElementById('order-id').textContent = orderId;
  document.getElementById('product').textContent = product.name;
  document.getElementById('size').textContent = size;
  document.getElementById('amount').textContent = amount;
  document.getElementById('pix-type').textContent = cfg.pixKeyType || 'Chave Pix';
  document.getElementById('receiver').textContent = cfg.pixReceiverName || cfg.storeName || 'Loja';
  document.getElementById('pix-key').textContent = cfg.pixKey || 'CHAVE PIX NÃO CONFIGURADA';

  const status = document.getElementById('status');
  const copy = async (text, ok) => {
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = ok; status.className = 'notice ok';
    } catch {
      status.textContent = 'Não foi possível copiar automaticamente. Selecione e copie manualmente.'; status.className = 'notice warning';
    }
  };

  document.getElementById('copy-key').onclick = () => copy(cfg.pixKey || '', 'Chave Pix copiada. Abra o app do seu banco e faça o pagamento.');

  if ((cfg.pixCopyPaste || '').trim()) {
    document.getElementById('copy-paste-box').hidden = false;
    document.getElementById('pix-code').value = cfg.pixCopyPaste;
    document.getElementById('copy-code').onclick = () => copy(cfg.pixCopyPaste, 'Pix Copia e Cola copiado. Abra o app do banco e cole o código.');
  }

  document.getElementById('whatsapp').onclick = () => {
    const number = String(cfg.whatsappNumber || '').replace(/\D/g,'');
    const text = `Olá! Eu, ${name}, realizei o pagamento do pedido ${orderId}.\n\nProduto: ${product.name}\nTamanho: ${size}\nValor: ${amount}\n\nEstou encaminhando o comprovante para confirmação e finalização do pedido.`;
    if (!number) { status.textContent='WhatsApp da loja não configurado.'; status.className='notice warning'; return; }
    location.href = `https://wa.me/${number}?text=${encodeURIComponent(text)}`;
  };
});
</script>
</body>
</html>
